<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexumi — встановити пароль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <header><a href="index.html" class="brand">Lexumi адмін</a></header>
  <main>
    <div class="card login-card">
      <h1>Встановити пароль</h1>
      <p class="hint">Це посилання з листа скидання пароля — сесія вже підтверджена, лишилось
        задати новий пароль. Далі можна входити в панель звичайним email+паролем.</p>
      <form id="set-password-form">
        <label>Новий пароль <input type="password" name="password" minlength="6" required></label>
        <button type="submit">Зберегти пароль</button>
      </form>
      <p id="status"></p>
      <p><a href="index.html">До панелі</a></p>
    </div>
  </main>
  <script type="module">
    import { supabaseClient } from './supabase-client.js';

    const statusEl = document.getElementById('status');
    document.getElementById('set-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = new FormData(e.target).get('password');
      const { error } = await supabaseClient.auth.updateUser({ password });
      statusEl.textContent = error ? error.message : 'Пароль збережено — можна входити в панель.';
    });
  </script>
</body>
</html>
